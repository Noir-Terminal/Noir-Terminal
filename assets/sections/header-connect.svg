<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="40" viewBox="0 0 640 40" role="img" aria-label="Connect">
<title>Connect</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
.cur{animation:cur 1.1s steps(1) infinite}
.blink{animation:blink 1.1s steps(1) infinite}
.ln{animation:ln .01s both}
@keyframes cur{50%{fill-opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes ln{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.cur,.blink,.ln{animation:none}}
</style>
<g transform="translate(0 0)"><rect x="0.5" y="0.5" width="639" height="39" fill="#0a0a0a" stroke="#262626"/><rect x="0.5" y="0.5" width="40" height="39" fill="#f2f2f2"/><text x="20.5" y="25" font-size="14" fill="#050505" text-anchor="middle" font-weight="bold">09</text><text x="58" y="25" font-size="13" fill="#f2f2f2" letter-spacing="3" font-weight="bold">CONNECT</text><text x="624" y="25" font-size="12" fill="#5c5c5c" text-anchor="end">$ ssh signal@noir</text></g>
</svg>
